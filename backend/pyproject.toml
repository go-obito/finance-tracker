[project]
name = "finance-tracker"
version = "0.1.0"
description = "A production-ready finance tracker with clean architecture"
readme = "README.md"
authors = [
    { name = "Michael Mawuli", email = "uglytino@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.scripts]
finance-tracker = "finance_tracker:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
